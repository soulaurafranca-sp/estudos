<style>
/* Layout: caderno de estudo — coluna única centrada (máx. 760px), barra de abas fixa embaixo, exercícios em tela cheia. */
:root{

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

  --brand:#7D95FF; --brand-ink:#0B1020; --mark:#6B5A10; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D111A; --surface:#151B27; --surface-2:#1E2636; --ink:#E7EBF3; --muted:#9AA3B7; --line:#2A3345;
  --ok:#4CC38A; --ok-bg:#11261B; --bad:#FF7B70; --bad-bg:#2B1513; --warn:#F2B84B; --warn-bg:#2A2110;
  --brand:#7D95FF; --brand-ink:#0B1020; --mark:#6B5A10; color-scheme:dark; }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}

*{box-sizing:border-box}

#settings{scroll-margin-top:70px}
button{font:inherit;color:inherit;cursor:pointer}

.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}

.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}

.unit .t{font-weight:700}
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.brand{background:var(--brand);color:var(--brand-ink)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .en{font-weight:700}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--surface-2)}
.dots i.on{background:var(--ok)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.gram{line-height:1.6}
.gram h4{font-family:var(--f-display);font-size:16px;margin:14px 0 6px}
.gram table{border-collapse:collapse;width:100%;font-size:14.5px}
.gram td,.gram th{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.gram th{background:var(--surface-2)}
.gram .ex{border-left:3px solid var(--mark);padding:4px 10px;margin:6px 0;background:var(--surface-2);border-radius:0 8px 8px 0}
.gram p{margin:6px 0}
.tablewrap{overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.mode:hover{border-color:var(--brand)}
.mode b{font-size:15.5px}

.mode .ic svg{width:20px;height:20px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto}

.field{display:flex;flex-direction:column;gap:6px}

.inp{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;font-size:16px;width:100%}

.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;font-size:14px;max-width:90vw}
/* runner */
#run{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#run .rtop,#run .rbody,#run .rfoot{width:100%;max-width:700px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#run .rtop{display:flex;align-items:center;gap:12px;padding-block:12px}
#run .rtop .bar{flex:1;height:10px}

.fb{border-top:1px solid var(--line)}

.opt{text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:16.5px;font-weight:600;display:flex;gap:12px;align-items:center}

.audio-big{display:flex;gap:12px;align-items:center}
.play{width:72px;height:72px;border-radius:20px;background:var(--brand);color:var(--brand-ink);border:0;display:grid;place-items:center}
.play svg{width:34px;height:34px}
.play.sm{width:48px;height:48px;border-radius:14px}

.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:9px 13px;border-radius:10px;border:1.5px solid var(--line);border-bottom-width:3px;background:var(--surface);font-weight:600;font-size:16px}
.tile.used{visibility:hidden}
.answer-zone{min-height:62px;border-bottom:2px dashed var(--line);padding-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}

<script>
window.APP = {
  key: "knn-en-b1",
  lang: "en-US", ttsLang: "en", dictLang: "en", langName: "Inglês",
  voiceHints: /samantha|aria|jenny|guy|google us|alex|ava|allison/i,
  voiceSample: "Hello! How are you? I drink a cup of coffee every morning.",
  unitWord: "Unit", bookWord: "na apostila", bookWord2: "aula da KNN", bookTitle: "KNN · Book 1",
  tagline: "Inglês · KNN Book 1",
  welcomeTitle: "Memorize o vocabulário da apostila, um pouco por dia.",
  welcomeText: "Este app segue as Units do Book 1 da KNN e transforma cada palavra e frase em revisões espaçadas com leitura, escrita, ditado e fala. Crie um perfil para cada pessoa que vai estudar.",
  startQuestion: "Em qual Unit da apostila você está agora?",
  startHint: "O app só apresenta palavras novas até essa Unit. Você pode avançar depois, conforme as aulas.",
  contractions: { "don't": "do not", "doesn't": "does not", "didn't": "did not", "i'm": "i am", "you're": "you are", "it's": "it is", "can't": "cannot", "i'd": "i would", "what's": "what is", "how's": "how is", "aren't": "are not", "isn't": "is not", "we're": "we are", "they're": "they are", "he's": "he is", "she's": "she is", "that's": "that is" },
  units: [
{ id:"u1", n:1, title:"Food & Drinks", short:"Unit 1", sub:"Simple Present (I / You) · cumprimentos",
grammar:`<h4>Simple Present — afirmativa e negativa</h4><p>Usado para hábitos e gostos. Com <b>I</b> e <b>you</b> o verbo fica igual ao infinitivo, sem "to".</p>
<div class="ex">I <b>drink</b> cold water. — Eu bebo água gelada.<br>You <b>don't eat</b> rice and meat. — Você não come arroz e carne.</div>

{ id:"u2", n:2, title:"Breakfast & Snacks", short:"Unit 2", sub:"like / want (to) · but · bom dia, boa tarde…",

<h4>His / her</h4><p><b>his</b> = dele · <b>her</b> = dela. Concordam com o dono, não com a coisa: <b>her</b> brother (o irmão dela).</p>`,

/* ---------- content index ---------- */
const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48);
const ITEMS = [], BYID = {};
C.units.forEach((u, ui) => {
  u.ui = ui; u.items = [];
  if (u.review) return;
  const seen = new Set();
  (u.vocab || []).forEach(v => {
    let id = u.id + ":w:" + slug(v[0]); if (seen.has(id)) id += "2"; seen.add(id);
    const it = { id, u: u.id, ui, k: "w", t: v[0], m: v[1], ex: v[2] || "", exm: v[3] || "" };
    ITEMS.push(it); BYID[id] = it; u.items.push(it);

  (u.sentences || []).forEach(s => {
    let id = u.id + ":s:" + slug(s[0]); if (seen.has(id)) id += "2"; seen.add(id);
    const it = { id, u: u.id, ui, k: "s", t: s[0], m: s[1] };

});
const UNIT = Object.fromEntries(C.units.map(u => [u.id, u]));
const LEARN_UNITS = C.units.filter(u => !u.review);

/* ---------- dates ---------- */
const dkey = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const dnum = (d = new Date()) => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);

const INTERVALS = [0, 1, 2, 4, 7, 12, 21, 35, 60, 100];
const MASTER = 4; // box a partir do qual a palavra conta como "consolidada"

/* ---------- state ---------- */
const LS = C.key + "-v1";
let S = { profiles: {}, order: [], last: null, deleted: [] };
let P = null;
let view = "today", viewArg = null;
try { const j = JSON.parse(localStorage.getItem(LS) || "null"); if (j && j.profiles) S = Object.assign(S, j); } catch (e) {}
const COLORS = ["#2747D0", "#0E7C66", "#C2410C", "#9D174D", "#6D28D9", "#0369A1", "#4D7C0F", "#B45309"];

function newProfile(name, color, unit) {
  return {
    id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), app: C.key, name, color,
    created: Date.now(), updated: Date.now(),
    set: { newPerDay: 10, maxRev: 80, unit: unit || 1, speak: true, audio: true, rate: 1, voice: "" },
    it: {}, days: {}, sk: { r: [0, 0], w: [0, 0], l: [0, 0], f: [0, 0] }, exam: { hist: [] }, cur: null, writes: []
  };
}
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
function setProfile(id) { P = S.profiles[id] || null; S.last = P ? P.id : null; saveLocal(); updateChip(); }

/* ---------- merge (para vários aparelhos) ---------- */
function mergeProfiles(a, b) { // retorna mescla; a e b são versões do mesmo perfil
  if (!a) return b; if (!b) return a;
  const newer = (b.updated || 0) > (a.updated || 0) ? b : a, older = newer === a ? b : a;
  const m = JSON.parse(JSON.stringify(newer));
  for (const [id, st] of Object.entries(older.it || {})) { const x = m.it[id]; if (!x || (st.t || 0) > (x.t || 0)) m.it[id] = st; }
  for (const [d, v] of Object.entries(older.days || {})) {
    const x = m.days[d]; if (!x) { m.days[d] = v; continue; }
    for (const k of Object.keys(v)) if (typeof v[k] === "number") x[k] = Math.max(x[k] || 0, v[k]);
  }
  const ids = new Set((m.exam?.hist || []).map(h => h.id));
  for (const h of (older.exam?.hist || [])) if (!ids.has(h.id)) m.exam.hist.push(h);
  const wid = new Set((m.writes || []).map(h => h.id));
  for (const h of (older.writes || [])) if (!wid.has(h.id)) (m.writes = m.writes || []).push(h);
  if (older.cur && (!m.cur || (older.cur.ts || 0) > (m.cur.ts || 0))) m.cur = older.cur;
  return m;
}

/* ---------- cloud sync (db do artifact) ---------- */
let cloud = null, ownerId = null, sync = "init", dirty = new Set(), saving = false, flushT = null, unsub = null;
const CL = window.CLOUD || {};
const FB = !!(CL.firebase && CL.firebase.apiKey && !(window.claude && window.claude.use));
let fbUser = null, authReady = !FB;
const SYNC_TXT = { ok: "Progresso salvo na nuvem e sincronizado entre computador e celular.", init: "Conectando à nuvem…", busy: "Salvando…", local: "Progresso salvo só neste aparelho.", signedout: "Você está sem login: o progresso fica só neste aparelho. Entre com Google para sincronizar.", readonly: "Seu acesso não permite salvar na nuvem; o progresso fica neste aparelho.", error: "Sem conexão com a nuvem agora; o progresso está salvo neste aparelho e sobe sozinho quando a conexão voltar." };
function setSync(s) { sync = s; const el = $("#syncdot"); if (!el) return; el.className = "sync " + ({ ok: "ok", error: "err", busy: "busy", init: "busy" }[s] || ""); el.title = SYNC_TXT[s] || ""; }
function touch() { if (!P) return; P.updated = Date.now(); saveLocal(); dirty.add(P.id); clearTimeout(flushT); flushT = setTimeout(flush, 1200); }
async function flush() {
  if (!cloud || saving || sync === "readonly") return;
  saving = true; if (sync !== "error") setSync("busy");
  try {
    for (const id of [...dirty]) {
      dirty.delete(id);
      const p = S.profiles[id];
      if (!p) { await cloud.ref(id).set({ app: C.key, deleted: true, updated: Date.now() }); continue; }
      p.owner = ownerId;
      await cloud.ref(id).set({ app: C.key, updated: p.updated, name: p.name, json: JSON.stringify(p) });
    }
    setSync("ok");
  } catch (e) { const c = e && e.code; setSync(c === "invalid_argument" || c === "permission-denied" ? "readonly" : "error"); }
  saving = false;
  if (dirty.size && sync === "ok") flushT = setTimeout(flush, 2500);
  if (sync === "error") { clearTimeout(flushT); flushT = setTimeout(() => { S.order.forEach(id => dirty.add(id)); flush(); }, 15000); }
}
function applyRemote(docs) {
  let changed = false;
  for (const d of docs) {
    const r = d.data(); if (!r || r.app !== C.key) continue;
    const id = d.id.slice(C.key.length + 1);
    if (r.deleted) { if (S.profiles[id]) { delete S.profiles[id]; S.order = S.order.filter(x => x !== id); changed = true; } continue; }
    if (S.deleted.includes(id)) continue;
    let rp; try { rp = JSON.parse(r.json); } catch (e) { continue; }
    const lp = S.profiles[id];
    if (!lp) { S.profiles[id] = rp; S.order.push(id); changed = true; continue; }
    if ((rp.updated || 0) !== (lp.updated || 0)) {
      const m = mergeProfiles(lp, rp); S.profiles[id] = m; changed = true;
      if ((lp.updated || 0) > (rp.updated || 0)) dirty.add(id);

  }

}
function subscribe(q) {

      first = false;
      const remoteIds = new Set(snap.docs.map(d => d.id.slice(C.key.length + 1)));

        if (remoteIds.has(id)) continue;

        else { delete S.profiles[id]; S.order = S.order.filter(x => x !== id); changed = true; }
      }
    }
    if (changed) {
      saveLocal();
      if (P) P = S.profiles[P.id] || null;
      if (!P && S.order.length) setProfile(S.last && S.profiles[S.last] ? S.last : S.order[0]);

      if ($("#run").hidden) render();

}
async function initCloud() {
  if (window.claude && window.claude.use) {
    try {
      const [dbx, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!dbx || !user) { setSync("local"); return; }
      const uid = await user.id();
      if (!uid) { setSync("local"); return; }
      ownerId = "claude:" + uid;
      cloud = { ref: id => dbx.doc("data/users/" + uid + "/" + C.key + "-" + id) };
      subscribe(dbx.collection("data/users/" + uid).where("app", "==", C.key));
    } catch (e) { setSync("local"); }
    return;
  }

    try {
      if (!firebase.apps.length) firebase.initializeApp(CL.firebase);
      const auth = firebase.auth(), fs = firebase.firestore();
      auth.getRedirectResult().catch(e => { if (e && e.code) toast("Não foi possível entrar: " + e.code); });
      setTimeout(() => { if (!authReady) { authReady = true; render(); } }, 6000);
      auth.onAuthStateChanged(u => {
        authReady = true;
        if (unsub) { unsub(); unsub = null; }
        fbUser = u;
        if (!u) { cloud = null; ownerId = null; setSync("signedout"); render(); return; }
        ownerId = "g:" + u.uid; S.localOnly = false; saveLocal();
        const col = fs.collection("users").doc(u.uid).collection("profiles");
        cloud = { ref: id => col.doc(C.key + "-" + id) };
        setSync("init");
        subscribe(col.where("app", "==", C.key));
        render();
      });
    } catch (e) { authReady = true; setSync("local"); render(); }
    return;
  }
  const wasReady = authReady; authReady = true;
  setSync("local");
  if (!wasReady) render();
}
function loginGoogle() {
  const prov = new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({ prompt: "select_account" });
  firebase.auth().signInWithPopup(prov).catch(e => {
    const c = e && e.code;
    if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment") firebase.auth().signInWithRedirect(prov);
    else if (c === "auth/unauthorized-domain") toast("Este endereço não está autorizado no Firebase (veja o LEIA-ME, passo 1).");
    else if (c && c !== "auth/popup-closed-by-user" && c !== "auth/cancelled-popup-request") toast("Não foi possível entrar: " + c);
  });
}
async function logoutGoogle() {
  try { clearTimeout(flushT); await flush(); } catch (e) {}
  await firebase.auth().signOut();
  for (const id of [...S.order]) if (S.profiles[id] && S.profiles[id].owner) { delete S.profiles[id]; S.order = S.order.filter(x => x !== id); }

}

/* ---------- voz (TTS) ---------- */
let VOICES = [], ctts = null, playing = null;
function loadVoices() { try { VOICES = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith(C.lang.slice(0, 2))); } catch (e) { VOICES = []; } }
if ("speechSynthesis" in window) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }
function bestVoices() {
  const pref = (P && P.set.voice) || "";

  function score(v) { let s = 0; if (v.name === pref) s += 100; if (v.lang.replace("_", "-") === C.lang) s += 10; if (/natural|neural|premium|enhanced|google/i.test(v.name)) s += 5; if (C.voiceHints && C.voiceHints.test(v.name)) s += 3; return s; }
  return list;

if (window.claude && window.claude.use) claude.use("tts").then(t => { ctts = t; }).catch(() => {});
function speak(text, opts = {}) {

      speechSynthesis.cancel();

const SEC_REV = 12, SEC_NEW = 35;
function plan() {
  const due = dueItems().slice(0, P.set.maxRev), avail = nextNew(newLeftToday());
  const min = P.set.minutes || 0;
  if (!min) return { reviews: due, news: avail, dueAll: dueItems().length };
  const budget = min * 60;
  let r = Math.min(due.length, Math.floor(budget * 0.7 / SEC_REV));
  let n = Math.min(avail.length, Math.floor((budget - r * SEC_REV) / SEC_NEW));
  r = Math.min(due.length, r + Math.floor((budget - r * SEC_REV - n * SEC_NEW) / SEC_REV));
  return { reviews: due.slice(0, r), news: avail.slice(0, n), dueAll: dueItems().length };
}

  const pl = plan(); const reviews = pl.reviews, news = pl.news;

  for (let i = 0; i < news.length; i += 3) {
    const grp = news.slice(i, i + 3);
    for (const it of grp) { q.push({ id: it.id, ex: "intro", mode: "new" }); q.push({ id: it.id, ex: it.k === "w" ? "mc" : (P.set.audio ? "tiles_listen" : "mc"), mode: "new" }); }
    for (let k = 0; k < 4 && ri < reviews.length; k++, ri++) q.push({ id: reviews[ri].id, ex: exFor(reviews[ri], "rev"), mode: "rev" });
    for (const it of shuffle(grp)) q.push({ id: it.id, ex: exFor(it, "learn"), mode: "learn" });
  }
  for (; ri < reviews.length; ri++) q.push({ id: reviews[ri].id, ex: exFor(reviews[ri], "rev"), mode: "rev" });
  return q;
}

  const pick = shuffle(items).slice(0, n);
  const q = [];
  for (const it of pick) {
    if (!seen(it.id)) q.push({ id: it.id, ex: "intro", mode: "new" });
    let ex = exType === "mix" ? exFor(it, "rev") : exType;
    if (ex === "tiles" ) ex = it.k === "s" ? (P.set.audio ? "tiles_listen" : "tiles_pt") : "type_hint";
    q.push({ id: it.id, ex, mode: seen(it.id) ? "practice" : "new" });

}

    right = t.map((c, i) => mt[i] ? esc(c) : `<ins>${esc(c)}</ins>`).join("");
  } else {
    const k = w => norm(w, false);
    const [ma, mt] = lcsAlign(aw, tw, (x, y) => k(x) !== "" && k(x) === k(y));
    you = aw.map((w, i) => ma[i] ? esc(w) : `<del>${esc(w)}</del>`).join(" ");
    right = tw.map((w, i) => mt[i] ? esc(w) : `<ins>${esc(w)}</ins>`).join(" ");
  }

  <textarea class="inp" id="bk-out" readonly style="min-height:110px;font-family:var(--f-mono);font-size:12px">${code}</textarea>
  <button class="btn" data-act="bk-copy">Copiar código</button>
  <div class="field"><label for="bk-in">Importar um código</label><textarea class="inp" id="bk-in" style="min-height:90px;font-family:var(--f-mono);font-size:12px" placeholder="Cole o código aqui"></textarea></div>
  <button class="btn pri" data-act="bk-import">Importar (mescla com o progresso atual)</button><button class="btn ghost" data-act="sheet-close">Fechar</button>`);
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "sheet-bg" && ev.target !== el) return;
  const it = R && R.cur ? BYID[R.cur.id] : null;
  switch (a) {
    case "tab": view = el.dataset.v; viewArg = null; if (view !== "exam") {} render(); break;
    case "profiles": profilesSheet(); break;
    case "login": loginGoogle(); break;
    case "logout": logoutGoogle(); break;
    case "local-only": S.localOnly = true; saveLocal(); render(); break;
    case "sheet-bg": case "sheet-close": closeSheet(); break;
    case "pick-prof": setProfile(el.dataset.id); closeSheet(); view = "today"; render(); break;
    case "new-prof": newProfSheet(); break;
    case "np-color": el.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === el)); $("[data-act=np-save]").dataset.c = el.dataset.c; break;
    case "np-save": {
      const name = $("#np-name").value.trim(); if (!name) { $("#np-name").focus(); return; }
      const p = newProfile(name, el.dataset.c, +$("#np-unit").value);
      S.profiles[p.id] = p; S.order.push(p.id); setProfile(p.id); closeSheet(); touch(); view = "today"; render(); break;
    }
    case "del-prof": openSheet(`<h2 style="font-size:20px">Excluir "${esc(P.name)}"?</h2><p class="small muted">Todo o progresso deste perfil será apagado em todos os aparelhos. Não dá para desfazer.</p><button class="btn" style="color:var(--bad)" data-act="del-yes">Excluir definitivamente</button><button class="btn ghost" data-act="sheet-close">Cancelar</button>`); break;
    case "del-yes": { const id = P.id; delete S.profiles[id]; S.order = S.order.filter(x => x !== id); S.deleted.push(id); dirty.add(id); P = null; setProfile(S.order[0]); saveLocal(); flush(); closeSheet(); render(); break; }
    case "rename": openSheet(`<h2 style="font-size:20px">Renomear perfil</h2><input class="inp" id="rn" value="${esc(P.name)}" maxlength="30"><button class="btn pri" data-act="rn-save">Salvar</button><button class="btn ghost" data-act="sheet-close">Cancelar</button>`); break;
    case "rn-save": { const v = $("#rn").value.trim(); if (v) { P.name = v; touch(); updateChip(); } closeSheet(); render(); break; }
    case "backup": backupSheet(); break;
    case "bk-copy": { const t = $("#bk-out"); navigator.clipboard?.writeText(t.value).then(() => toast("Código copiado"), () => { t.select(); toast("Selecione e copie o código"); }); if (!navigator.clipboard) { t.select(); } break; }
    case "bk-import": {
      try { const p = JSON.parse(decodeURIComponent(escape(atob($("#bk-in").value.trim())))); if (!p || p.app !== C.key || !p.it) throw 0;
        const ex = S.profiles[p.id]; S.profiles[p.id] = ex ? mergeProfiles(ex, p) : p; if (!ex) S.order.push(p.id); S.profiles[p.id].updated = Date.now(); setProfile(p.id); dirty.add(p.id); saveLocal(); flush(); closeSheet(); render(); toast("Progresso importado");
      } catch (e) { toast("Código inválido. Confira se copiou o código inteiro."); }
      break;
    }
    case "set": { const k = el.dataset.k; P.set[k] = +el.dataset.v; touch(); const y = window.scrollY; render(); window.scrollTo(0, y); toast("Configuração salva"); break; }
    case "goto-settings": view = "progress"; render(); setTimeout(() => { const e = $("#settings"); if (e) e.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60); break;
    case "daily": startRun(buildSession(), "daily", "Sessão do dia"); break;
    case "resume": resumeRun(); break;
    case "advance": { const i = LEARN_UNITS.findIndex(u => u.n === P.set.unit); if (LEARN_UNITS[i + 1]) { P.set.unit = LEARN_UNITS[i + 1].n; touch(); toast(C.unitWord + " " + P.set.unit + " liberada"); render(); } break; }
    case "open-unit": view = "unit"; viewArg = el.dataset.u; render(); break;
    case "set-unit": P.set.unit = +el.dataset.n; touch(); toast(C.unitWord + " atual: " + P.set.unit); render(); break;
    case "practice": {
      const u = UNIT[el.dataset.u], x = el.dataset.x;
      const items = u.review ? ITEMS.filter(i => u.covers.includes(UNIT[i.u].n)) : u.items;
      if (x === "flash") return startFlash(items);
      let pool = items;
      if (x === "speak" || x === "tiles") pool = items.filter(i => i.k === "s").length >= 4 ? items.filter(i => i.k === "s") : items;
      startRun(practiceQueue(pool, x, 15), "practice", (u.review ? "Revisão" : C.unitWord + " " + u.n));
      break;
    }
    case "t-dict": startRun(practiceQueue(learnedItems(), "dict", 15), "practice", "Ditado relâmpago"); break;
    case "t-speak": { const L = learnedItems(); const s = L.filter(i => i.k === "s"); startRun(practiceQueue(s.length >= 5 ? s : L, "speak", 10), "practice", "Treino de fala"); break; }
    case "t-hard": { const L = learnedItems().filter(it => P.it[it.id].l > 0).sort((a, b) => P.it[b.id].l - P.it[a.id].l).slice(0, 20); startRun(practiceQueue(L, "mix", 20), "practice", "Palavras difíceis"); break; }
    case "t-flash": startFlash(learnedItems()); break;
    case "t-type": startRun(practiceQueue(learnedItems(), "type", 15), "practice", "Tradução escrita"); break;
    case "write": view = "write"; render(); break;
    case "wcorrect": {
      const w = writeState; if (!w.text.trim()) return toast("Escreva seu texto primeiro.");
      w.busy = true; render();
      correctWriting(w.text, w.prompt.t).then(r => { w.res = r; (P.writes = P.writes || []).push({ id: Date.now().toString(36), ts: Date.now(), task: w.prompt.t, nota: r.nota }); touch(); }).catch(e => { w.res = { error: aiErr(e) }; }).finally(() => { w.busy = false; if (view === "write") render(); });
      break;
    }
    /* runner */
    case "run-close": closeRun(false); break;
    case "run-done": closeRun(true); break;
    case "say": if (it) speak(it.t, { force: true }); break;
    case "say-slow": if (it) speak(it.t, { slow: true, force: true }); break;
    case "say-text": speak(el.dataset.t, { force: true }); break;
    case "next": if (R.kind === "flash") { R.pos++; R.flip = false; showFlash(); } else { R.pos++; if (R.kind === "daily" && P.cur) { P.cur.pos = R.pos; touch(); } showEx(); } break;
    case "pick": {
      if (R.ans) return; const o = R.opts[+el.dataset.i]; const ok = o.id === it.id || o.m === it.m;
      document.querySelectorAll(".opt").forEach((b, i) => { b.disabled = true; if (R.opts[i].m === it.m) b.classList.add("right"); });
      if (!ok) el.classList.add("wrong");
      feedback(ok, "ok", it); break;
    }
    case "check": doCheck(); break;
    case "why": {
      const box = $("#why"); el.disabled = true; el.innerHTML = "Analisando…";
      const ex = R.cur.ex;
      aiJson(`Você é professor(a) de ${C.langName} para uma aluna brasileira. Exercício: ${EXNAME[ex]} — ${EXHELP[ex] || ""}. Resposta esperada: "${it.t}" (significado em português: "${it.m}"). Resposta da aluna: "${R.lastAns}". Explique em português, de forma curta e didática, exatamente qual foi o erro (grafia, acento, artigo, ordem das palavras, tempo verbal, vocabulário…) e a regra ou o macete para não errar de novo. Se a resposta da aluna também estiver correta (sinônimo ou variação aceitável), diga isso. Responda SOMENTE com JSON: {"explicacao": "até 3 frases", "dica": "uma frase curta de memorização", "tambem_correta": true ou false}`)
        .then(r => {
          box.innerHTML = `<div class="card small stack" style="gap:6px">${r.tambem_correta ? '<span class="pill ok" style="align-self:flex-start">Sua resposta também é aceitável</span>' : ""}<div>${esc(r.explicacao || "")}</div>${r.dica ? `<div><b>Dica:</b> ${esc(r.dica)}</div>` : ""}${r.tambem_correta && R.ans && !R.ans.ok ? `<button class="btn sm" style="align-self:flex-start" data-act="accept">Contar como certa</button>` : ""}</div>`;
          el.remove();
        })
        .catch(e => { box.innerHTML = `<div class="small" style="color:var(--bad)">${esc(aiErr(e))}</div>`; el.disabled = false; el.innerHTML = I.spark + " Por que errei?"; });
      break;
    }
    case "accept": {
      if (!R.snap || !R.ans || R.ans.ok) break;
      if (R.snap.st) P.it[it.id] = R.snap.st; else delete P.it[it.id];
      const d = dayRec(); Object.assign(d, R.snap.dc);
      const k = R.q.findIndex((q, i) => i > R.pos && q.id === it.id && q.mode === "retry"); if (k > 0) R.q.splice(k, 1);
      R.wrong.delete(it.id); R.res.pop();
      grade(it, true, R.cur.mode); R.res.push({ id: it.id, ok: true, ex: R.cur.ex }); R.ans.ok = true;
      if (R.kind === "daily" && P.cur) P.cur.q = R.q;
      touch(); el.replaceWith(Object.assign(document.createElement("span"), { className: "pill ok", textContent: "Contada como certa" }));
      break;
    }
    case "ins": { const i = $("#ansinp"); if (i) { const p = i.selectionStart ?? i.value.length; i.value = i.value.slice(0, p) + el.dataset.c + i.value.slice(i.selectionEnd ?? p); i.focus(); i.setSelectionRange(p + 1, p + 1); } break; }
    case "tile": { if (R.ans) return; const t = R.tiles.all.find(x => x.i === +el.dataset.i); if (t && !R.tiles.picked.includes(t)) { R.tiles.picked.push(t); drawTiles(); } break; }
    case "untile": { if (R.ans) return; R.tiles.picked.splice(+el.dataset.k, 1); drawTiles(); break; }
    case "mic": {
      if (micState !== "idle") { micStop(); break; }
      try { speechSynthesis.cancel(); } catch (e) {}
      const target = it.t;
      micStart((text, final, reason) => {
        const sd = $("#said"); if (!sd || !R || R.cur.id !== it.id) return;
        if (reason && !["stopped", "viewer_stopped", "no-speech"].includes(reason) && !text.trim()) { sd.innerHTML = `<div class="small muted">Microfone indisponível (${esc(reason)}). Avalie você mesma com os botões abaixo.</div>`; return; }
        const r = speechScore(text, target);
        sd.innerHTML = `<div class="small muted">Você disse: “${esc(text.trim())}”</div><div>${r.words.map((w, i) => `<span class="${r.marks[i] ? "w-ok" : "w-miss"}">${esc(w)}</span>`).join(" ")}</div>`;
        if (final && text.trim() && !R.ans) { const ok = r.score >= 0.75; feedback(ok, ok && r.score < 1 ? "typo" : "ok", it, `<div class="small">Pronúncia reconhecida: ${Math.round(r.score * 100)}%</div>`); }
      });
      break;
    }
    case "self-ok": if (!R.ans) { micStop(); feedback(true, "ok", it); } break;
    case "self-bad": if (!R.ans) { micStop(); feedback(false, "bad", it); } break;
    case "flip": R.flip = !R.flip; if (R.flip && R.dir === "pt") speak(it.t); showFlash(); break;
    case "fdir": R.dir = el.dataset.d; R.flip = false; showFlash(); break;
    case "fl-ok": case "fl-bad": { const ok = a === "fl-ok"; grade(it, ok, R.cur.mode); skill("flash", ok); R.res.push({ id: it.id, ok }); if (!ok) R.wrong.add(it.id); touch(); R.pos++; R.flip = false; showFlash(); break; }
    /* exam */
    case "exam-sec": view = "examsec"; viewArg = el.dataset.s; EX = null; render(); examTimer(); break;
    case "exam-task": { EX.task = +el.dataset.i; const t = (viewArg === "ee" ? C.exam.ee : C.exam.eo)[EX.task]; EX.secs = t.secs; EX.tick = false; EX.text = ""; EX.res = null; render(); break; }
    case "ex-timer": EX.tick = !EX.tick; examTimer(); render(); break;
    case "co-play": speakLines(EX.list[EX.pos].audio); break;
    case "ex-pick": { const q = EX.list[EX.pos]; const i = +el.dataset.i; EX.ans[EX.pos] = { pick: i, ok: i === q.answer }; render(); break; }
    case "ex-next": EX.pos++; render(); break;
    case "ex-restart": EX = null; render(); break;
    case "eo-mic": {
      if (micState !== "idle") { micStop(); break; }
      const base = EX.text ? EX.text.trim() + " " : "";
      micStart((text, final, reason) => { const ta = $("#extext"); EX.text = base + text.trim(); if (ta) ta.value = EX.text; if (final && reason && !["stopped", "viewer_stopped"].includes(reason) && !text) toast("Microfone indisponível. Digite um resumo do que falou."); });
      break;
    }
    case "ex-correct": {
      if (!EX.text.trim()) return toast(viewArg === "ee" ? "Escreva seu texto primeiro." : "Grave ou digite sua resposta primeiro.");
      const t = (viewArg === "ee" ? C.exam.ee : C.exam.eo)[EX.task];
      EX.busy = true; render();
      correctWriting(EX.text, `${t.exam} — ${t.task} (${viewArg === "ee" ? "expressão escrita" : "expressão oral; o texto é a transcrição automática da fala, ignore pontuação e pequenas falhas de transcrição"}). ${t.prompt} ${t.words ? "Extensão pedida: " + t.words + "." : ""} Avalie segundo os critérios oficiais (adequação à tarefa, coerência, vocabulário, gramática).`, { level: "intermediário, preparando-se para o " + t.exam, examFields: ', "nclc_estimado": "NCLC estimado (ex.: 6)", "nota_exame": "nota estimada na escala do exame (TCF 0–20 ou TEF 0–699)"' })
        .then(r => { EX.res = r; if (r.nclc_estimado || r.nota_exame) r.resumo = `${r.nota_exame ? "Nota estimada: " + r.nota_exame + ". " : ""}${r.nclc_estimado ? "NCLC estimado: " + r.nclc_estimado + ". " : ""}${r.resumo || ""}`; P.exam.hist.push({ id: Date.now().toString(36), sec: viewArg, title: t.exam + " " + t.task, pct: Math.round((+r.nota || 0) * 10), ts: Date.now() }); touch(); })
        .catch(e => { EX.res = { error: aiErr(e) }; })
        .finally(() => { EX.busy = false; if (view === "examsec") render(); });
      break;
    }
  }
});
document.addEventListener("input", ev => {
  const el = ev.target; const k = el.dataset.actInput;
  if (k === "wtext") { writeState.text = el.value; const l = el.parentElement.querySelector("label .num"); if (l) l.textContent = `(${(el.value.trim().match(/\S+/g) || []).length} palavras)`; }
  if (k === "extext" && EX) { EX.text = el.value; const l = el.parentElement.querySelector("label .num"); if (l) l.textContent = `(${(el.value.trim().match(/\S+/g) || []).length} palavras)`; }
});
document.addEventListener("change", ev => {
  const el = ev.target; const k = el.dataset.actChange; if (!k) return;
  if (k === "voice") { P.set.voice = el.value; touch(); speak(C.voiceSample, { force: true }); }
  if (k === "audio") { P.set.audio = el.checked; touch(); }
  if (k === "speakset") { P.set.speak = el.checked; touch(); }
  if (k === "wprompt") { writeState.prompt = writePrompts()[+el.value]; writeState.res = null; render(); }
});
document.addEventListener("keydown", ev => {
  if (!R || $("#run").hidden) return;
  if (ev.key === "Enter") {
    ev.preventDefault();
    if (R.ans || (R.cur && R.cur.ex === "intro")) { $("[data-act=next]")?.click(); }
    else if (R.kind !== "flash") doCheck();
  } else if (R.kind === "flash" && ev.key === " ") { ev.preventDefault(); if (!R.flip) $("[data-act=flip]")?.click(); }
  else if (!R.ans && R.cur && ["mc", "listen"].includes(R.cur.ex) && /^[1-4]$/.test(ev.key) && document.activeElement?.tagName !== "INPUT") { document.querySelectorAll(".opt")[+ev.key - 1]?.click(); }
});

/* ---------- boot ---------- */
if (S.last && S.profiles[S.last]) setProfile(S.last); else if (S.order.length) setProfile(S.order[0]); else updateChip();
render();
setSync("init");
initCloud();
window.addEventListener("focus", () => { if (dirty.size) flush(); });
})();

</script>

</body></html>
