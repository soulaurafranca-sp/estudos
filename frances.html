<style>
/* Layout: caderno de estudo — coluna única centrada (máx. 760px), barra de abas fixa embaixo, exercícios em tela cheia. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#E9EDF6; --ink:#121826; --muted:#59627A; --line:#D8DEEA;
  --ok:#17804F; --ok-bg:#E2F4EA; --bad:#C2352B; --bad-bg:#FBE7E5; --warn:#9A6400; --warn-bg:#FFF3D6;
  --brand:#0D6B5B; --brand-ink:#FFFFFF; --mark:#FFC2D6;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D111A; --surface:#151B27; --surface-2:#1E2636; --ink:#E7EBF3; --muted:#9AA3B7; --line:#2A3345;
  --ok:#4CC38A; --ok-bg:#11261B; --bad:#FF7B70; --bad-bg:#2B1513; --warn:#F2B84B; --warn-bg:#2A2110;
  --brand:#45C9AA; --brand-ink:#06201A; --mark:#6A2B43; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D111A; --surface:#151B27; --surface-2:#1E2636; --ink:#E7EBF3; --muted:#9AA3B7; --line:#2A3345;
  --ok:#4CC38A; --ok-bg:#11261B; --bad:#FF7B70; --bad-bg:#2B1513; --warn:#F2B84B; --warn-bg:#2A2110;
  --brand:#45C9AA; --brand-ink:#06201A; --mark:#6A2B43; color-scheme:dark; }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
#settings{scroll-margin-top:70px}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;flex:none}
.brand b{font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px;font-weight:600;font-size:14px;max-width:46vw}
.chip span.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.sync{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok{background:var(--ok)} .sync.err{background:var(--bad)} .sync.busy{background:var(--warn)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:11px 16px;font-weight:700;font-size:15px;min-height:46px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.mk{background:linear-gradient(180deg,transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);padding:0 .08em}
.hero{background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(24px,5vw,32px)}
.hero .btn.pri{background:var(--brand-ink);color:var(--brand);border-color:var(--brand-ink)}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap}
.hero .meta div{display:flex;flex-direction:column}
.hero .meta b{font-family:var(--f-mono);font-size:24px;line-height:1.1}
.hero .meta span{font-size:13px;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--f-mono);font-size:22px}
.stat span{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.ok i{background:var(--ok)}
.unit{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.unit:hover{border-color:var(--muted)}
.unit .n{width:40px;height:40px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;flex:none}
.unit.cur .n{background:var(--brand);color:var(--brand-ink)}
.unit.lock{opacity:.6}
.unit.rev .n{background:var(--mark);color:var(--ink)}
.unit .t{font-weight:700}
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.brand{background:var(--brand);color:var(--brand-ink)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .en{font-weight:700}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--surface-2)}
.dots i.on{background:var(--ok)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.gram{line-height:1.6}
.gram h4{font-family:var(--f-display);font-size:16px;margin:14px 0 6px}
.gram table{border-collapse:collapse;width:100%;font-size:14.5px}
.gram td,.gram th{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.gram th{background:var(--surface-2)}
.gram .ex{border-left:3px solid var(--mark);padding:4px 10px;margin:6px 0;background:var(--surface-2);border-radius:0 8px 8px 0}
.gram p{margin:6px 0}
.tablewrap{overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.mode:hover{border-color:var(--brand)}
.mode b{font-size:15.5px}
.mode .ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--brand)}
.mode .ic svg{width:20px;height:20px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--surface-2)}
.heat i.l1{background:color-mix(in srgb,var(--brand) 30%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--brand) 60%,var(--surface-2))}
.heat i.l3{background:var(--brand)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.inp{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;font-size:16px;width:100%}
.inp:focus{border-color:var(--brand);outline:none}
textarea.inp{min-height:160px;resize:vertical;line-height:1.55}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;font-size:14px;max-width:90vw}
/* runner */
#run{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#run .rtop,#run .rbody,#run .rfoot{width:100%;max-width:700px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#run .rtop{display:flex;align-items:center;gap:12px;padding-block:12px}
#run .rtop .bar{flex:1;height:10px}
#run .rbody{flex:1;overflow-y:auto;padding-block:10px 20px;display:flex;flex-direction:column;gap:16px}
#run .rfoot{padding-block:12px calc(14px + env(safe-area-inset-bottom,0px))}
.fb{border-top:1px solid var(--line)}
.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)} .fb.warn{background:var(--warn-bg)}
.fb .rfoot{display:flex;flex-direction:column;gap:10px}
.fb h3{font-size:19px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)} .fb.warn h3{color:var(--warn)}
.kind{font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.kind .tag{background:var(--surface-2);padding:3px 8px;border-radius:7px}
.prompt{font-family:var(--f-display);font-size:clamp(24px,6vw,34px);font-weight:700;line-height:1.2}
.prompt.s{font-size:clamp(20px,4.6vw,26px)}
.sub{font-size:17px;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:16.5px;font-weight:600;display:flex;gap:12px;align-items:center}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.opt:hover{border-color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.audio-big{display:flex;gap:12px;align-items:center}
.play{width:72px;height:72px;border-radius:20px;background:var(--brand);color:var(--brand-ink);border:0;display:grid;place-items:center}
.play svg{width:34px;height:34px}
.play.sm{width:48px;height:48px;border-radius:14px}
.play.sm svg{width:22px;height:22px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:9px 13px;border-radius:10px;border:1.5px solid var(--line);border-bottom-width:3px;background:var(--surface);font-weight:600;font-size:16px}
.tile.used{visibility:hidden}
.answer-zone{min-height:62px;border-bottom:2px dashed var(--line);padding-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.hint{font-family:var(--f-mono);letter-spacing:.18em;color:var(--muted);font-size:15px}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.mic svg{width:36px;height:36px}
.mic.on{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 50%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.said{font-size:18px;line-height:1.7}
.said .w-ok{color:var(--ok);font-weight:700} .said .w-miss{color:var(--bad);text-decoration:line-through}
.flash{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;border-radius:18px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{align-items:center}.sheet .panel{border-radius:20px}}
.prof{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%;text-align:left}
.prof:hover{border-color:var(--brand)}
.prof .av{width:40px;height:40px;font-size:16px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:600}
.examtext{white-space:pre-wrap;line-height:1.65;font-size:16px;background:var(--surface-2);border-radius:12px;padding:14px}
.corr{border-left:3px solid var(--bad);padding:6px 10px;background:var(--surface-2);border-radius:0 8px 8px 0}
.corr s{color:var(--bad)} .corr b{color:var(--ok)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.diff{display:flex;flex-direction:column;gap:5px;font-size:17px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.6}
.diff .lbl{display:inline-block;min-width:52px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.diff del{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.diff ins{text-decoration:none;color:var(--ok);font-weight:800;border-bottom:3px solid var(--ok)}
details summary{cursor:pointer;font-weight:700}
.kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 5px}
.hide-sm{} @media (max-width:520px){.hide-sm{display:none}}
</style>

<header class="top"><div class="in">
  <div class="brand"><div class="logo">FR</div><b>Francês · TEF / TCF</b></div>
  <span class="sync" id="syncdot" title="Sincronização"></span>

<script>
window.APP = {
  key: "fr-tef-tcf",
  lang: "fr-FR", ttsLang: "fr", dictLang: "fr", langName: "Francês",
  voiceHints: /amélie|amelie|thomas|audrey|aurélie|marie|denise|henri|google français|chantal/i,
  voiceSample: "Bonjour ! Je m'appelle Laura et j'apprends le français.",
  unitWord: "Unidade", bookWord: "no curso", bookWord2: "etapa do curso", bookTitle: "Francês · A1 → B2 · TEF / TCF",
  tagline: "Francês · do zero ao TEF / TCF",
  welcomeTitle: "Francês todos os dias, com foco no TEF e no TCF.",
  welcomeText: "Mesma metodologia do app de inglês: palavras e frases em repetição espaçada, com leitura, escrita, ditado e fala, do A1 ao B2. Na aba Provas você treina compreensão oral e escrita e faz tarefas de expressão no formato TEF Canada e TCF Canada, com correção do Claude.",
  startQuestion: "Por onde começar?",
  startHint: "Se você nunca estudou francês, comece pela Unidade 1. O app libera a próxima unidade quando você terminar a atual.",
  specialChars: ["é","è","ê","à","â","ç","ù","û","î","ô","ë","ï","œ"],
  articles: ["le","la","les","l'","un","une","des"],
  keepCase: ["Monsieur","Madame","Sophie","Marie"],
  units: [
{ id:"f1", n:1, title:"Salutations", short:"Unidade 1", sub:"A1 · cumprimentar, apresentar-se · verbo être",
grammar:`<h4>Verbo être (ser/estar)</h4><table><tr><td>je suis</td><td>nous sommes</td></tr><tr><td>tu es</td><td>vous êtes</td></tr><tr><td>il / elle est</td><td>ils / elles sont</td></tr></table>
<h4>Tu ou vous?</h4><p><b>tu</b> = informal (amigos, família). <b>vous</b> = formal ou plural. Em prova e em situações oficiais, use <b>vous</b>.</p>

{ id:"f2", n:2, title:"Identité", short:"Unidade 2", sub:"A1 · nacionalidade, cidade, idade · verbo avoir · -er",
grammar:`<h4>Verbo avoir (ter)</h4><table><tr><td>j'ai</td><td>nous avons</td></tr><tr><td>tu as</td><td>vous avez</td></tr><tr><td>il / elle a</td><td>ils / elles ont</td></tr></table>
<p>Idade usa <b>avoir</b>: <b>J'ai 36 ans</b> (literalmente "tenho 36 anos").</p>
<h4>Verbos em -er (parler, habiter, travailler)</h4><table><tr><td>je parle</td><td>nous parlons</td></tr><tr><td>tu parles</td><td>vous parlez</td></tr><tr><td>il parle</td><td>ils parlent</td></tr></table><p>parle / parles / parlent soam iguais.</p>

<h4>Nacionalidade</h4><p>Masculino / feminino: brésilien / brésili<b>enne</b>, français / français<b>e</b>, canadien / canadi<b>enne</b>.</p>`,

{ id:"f3", n:3, title:"La famille", short:"Unidade 3", sub:"A1 · família · possessivos mon/ma/mes",
grammar:`<h4>Possessivos</h4><table><tr><th></th><th>masc.</th><th>fem.</th><th>plural</th></tr><tr><td>meu</td><td>mon</td><td>ma</td><td>mes</td></tr><tr><td>teu</td><td>ton</td><td>ta</td><td>tes</td></tr><tr><td>seu (dele/dela)</td><td>son</td><td>sa</td><td>ses</td></tr><tr><td>nosso</td><td colspan="2">notre</td><td>nos</td></tr><tr><td>seu (de vocês)</td><td colspan="2">votre</td><td>vos</td></tr><tr><td>deles</td><td colspan="2">leur</td><td>leurs</td></tr></table>
<p>Concorda com a <b>coisa possuída</b>, não com o dono: <b>sa</b> fille = a filha dele <i>ou</i> dela. Antes de vogal usa-se mon: <b>mon</b> amie.</p>
<h4>Il y a / c'est</h4><div class="ex">Dans ma famille, <b>il y a</b> quatre personnes. — Na minha família há quatro pessoas.<br><b>C'est</b> ma fille. — Esta é minha filha.</div>`,

{ id:"f4", n:4, title:"Les nombres et l'heure", short:"Unidade 4", sub:"A1 · números 0–100 · horas · preços",

{ id:"f5", n:5, title:"Le temps et le calendrier", short:"Unidade 5", sub:"A1 · dias, meses, estações, clima · aller",

{ id:"f10", n:11, title:"Les achats", short:"Unidade 11", sub:"A2 · roupas, cores · concordância dos adjetivos · demonstrativos",
grammar:`<h4>Adjetivos: concordância</h4><p>Feminino: geralmente + <b>e</b> (vert → verte); plural: + <b>s</b>. Irregulares: blanc → blanche, beau → belle, nouveau → nouvelle, vieux → vieille.</p>
<p>A maioria vem <b>depois</b> do substantivo (une robe <b>rouge</b>). Alguns curtos vêm antes: <b>petit, grand, beau, joli, bon, nouveau, vieux</b>.</p>

grammar:`<h4>Subjuntivo</h4><p>Radical de <b>ils</b> no presente + -e, -es, -e, -ions, -iez, -ent (ils parl<b>ent</b> → que je parl<b>e</b>). Irregulares: être → que je <b>sois</b>; avoir → que j'<b>aie</b>; faire → que je <b>fasse</b>; aller → que j'<b>aille</b>; pouvoir → que je <b>puisse</b>.</p>
<p>Depois de: <b>il faut que</b>, <b>il est important que</b>, <b>je veux que</b>, <b>bien que</b>, <b>pour que</b>, <b>je ne pense pas que</b>…</p>
<div class="ex">Il faut que nous <b>réduisions</b> nos déchets.<br><b>Je pense que</b> c'est utile (indicativo) × <b>Je ne pense pas que</b> ce <b>soit</b> utile (subjuntivo).</div>`,
vocab:[["l'environnement","o meio ambiente"],["le réchauffement climatique","o aquecimento global"],["la pollution","a poluição"],["les déchets","o lixo, os resíduos"],["recycler","reciclar"],["le gaspillage","o desperdício"],["les transports en commun","o transporte público"],["l'énergie renouvelable","a energia renovável"],["la société","a sociedade"],["l'inégalité","a desigualdade"],["le logement social","a moradia popular"],["le bénévolat","o voluntariado"],["à mon avis","na minha opinião"],["selon moi","segundo eu, para mim"],["je suis d'accord","eu concordo"],["je ne suis pas d'accord","eu não concordo"],["il faut que","é preciso que"],["il est important que","é importante que"],["bien que","embora"],["pour que","para que"],["que je sois","que eu seja"],["que je fasse","que eu faça"]],
sentences:[["À mon avis, il faut que chacun recycle ses déchets.","Na minha opinião, é preciso que cada um recicle seu lixo."],["Il est important que les villes développent les transports en commun.","É importante que as cidades desenvolvam o transporte público."],["Bien que ce soit difficile, nous devons changer nos habitudes.","Embora seja difícil, precisamos mudar nossos hábitos."],["Je ne pense pas que cette mesure soit suffisante.","Não acho que esta medida seja suficiente."],["Le gaspillage alimentaire est un vrai problème de société.","O desperdício de alimentos é um verdadeiro problema social."],["Je fais du bénévolat pour que les enfants aient accès à la lecture.","Faço voluntariado para que as crianças tenham acesso à leitura."]],
write:["Dê sua opinião (150 palavras): as cidades deveriam proibir carros no centro?"]},

{ id:"f21", n:24, title:"Médias et numérique", short:"Unidade 24", sub:"B2 · internet, redes, informação · pronomes relativos",
grammar:`<h4>Pronomes relativos</h4><table><tr><th>qui</th><td>sujeito</td><td>L'article <b>qui</b> parle de l'IA…</td></tr><tr><th>que</th><td>objeto direto</td><td>Le site <b>que</b> je consulte…</td></tr><tr><th>où</th><td>lugar ou tempo</td><td>La ville <b>où</b> j'habite… Le jour <b>où</b>…</td></tr><tr><th>dont</th><td>substitui "de + …"</td><td>L'application <b>dont</b> je parle… (parler de)</td></tr><tr><th>lequel / laquelle</th><td>depois de preposição</td><td>L'outil avec <b>lequel</b> je travaille…</td></tr></table>
<p>Ce qui / ce que = o que: <b>Ce qui</b> m'inquiète, c'est la désinformation.</p>`,
vocab:[["les médias","a mídia"],["l'actualité","as notícias, a atualidade"],["l'article","o artigo"],["le journal","o jornal"],["les réseaux sociaux","as redes sociais"],["la désinformation","a desinformação"],["les fausses nouvelles","as notícias falsas"],["la vie privée","a privacidade"],["les données personnelles","os dados pessoais"],["le télétravail","o trabalho remoto"],["l'écran","a tela"],["télécharger","baixar"],["l'application","o aplicativo"],["le logiciel","o software"],["l'intelligence artificielle","a inteligência artificial"],["en ligne","on-line"],["qui","que (sujeito)"],["que","que (objeto)"],["dont","do qual, de que"],["ce qui","o que (sujeito)"],["ce que","o que (objeto)"],["s'informer","informar-se"]],
sentences:[["Les réseaux sociaux sont des outils qui peuvent informer ou désinformer.","As redes sociais são ferramentas que podem informar ou desinformar."],["Le logiciel que nous utilisons au bureau est très pratique.","O software que usamos no escritório é muito prático."],["C'est l'application dont je t'ai parlé.","Este é o aplicativo de que te falei."],["Ce qui m'inquiète, c'est la protection des données personnelles.","O que me preocupa é a proteção dos dados pessoais."],["Le télétravail a changé la façon dont nous travaillons.","O trabalho remoto mudou a forma como trabalhamos."],["Je m'informe surtout en ligne.","Eu me informo principalmente on-line."]],
write:["Escreva um texto (150 palavras) sobre as vantagens e desvantagens do trabalho remoto."]},

{ id:"f22", n:25, title:"Argumenter", short:"Unidade 25", sub:"B2 · conectores lógicos para EE e EO",
grammar:`<h4>Conectores essenciais para TEF/TCF</h4><table><tr><th>Introduzir</th><td>tout d'abord, premièrement, d'une part … d'autre part</td></tr><tr><th>Acrescentar</th><td>de plus, en outre, par ailleurs, également</td></tr><tr><th>Opor</th><td>cependant, pourtant, en revanche, néanmoins, alors que</td></tr><tr><th>Conceder</th><td>certes … mais, bien que (+ subj.), même si</td></tr><tr><th>Causa</th><td>parce que, car, puisque, grâce à, à cause de</td></tr><tr><th>Consequência</th><td>donc, ainsi, c'est pourquoi, par conséquent</td></tr><tr><th>Exemplo</th><td>par exemple, notamment, comme</td></tr><tr><th>Concluir</th><td>en conclusion, pour conclure, en somme, finalement</td></tr></table>
<p>Estrutura de texto argumentativo: <b>introdução</b> (tema + sua posição) → <b>2 argumentos com exemplos</b> → <b>contra-argumento</b> → <b>conclusão</b>.</p>`,
vocab:[["tout d'abord","em primeiro lugar"],["d'une part","por um lado"],["d'autre part","por outro lado"],["de plus","além disso"],["en outre","além do mais"],["par ailleurs","por outro lado, aliás"],["cependant","no entanto"],["pourtant","contudo, mesmo assim"],["en revanche","em contrapartida"],["néanmoins","todavia"],["certes","é verdade que, certamente"],["même si","mesmo que"],["car","pois"],["puisque","já que"],["grâce à","graças a"],["à cause de","por causa de"],["donc","portanto"],["par conséquent","consequentemente"],["c'est pourquoi","é por isso que"],["notamment","especialmente, notadamente"],["en conclusion","em conclusão"],["en somme","em suma"]],
sentences:[["Tout d'abord, le télétravail permet de gagner du temps.","Em primeiro lugar, o trabalho remoto permite ganhar tempo."],["De plus, il réduit la pollution liée aux transports.","Além disso, reduz a poluição ligada aos transportes."],["Certes, il favorise l'isolement, mais on peut organiser des réunions en personne.","É verdade que favorece o isolamento, mas é possível organizar reuniões presenciais."],["En revanche, certains métiers ne peuvent pas se faire à distance.","Em contrapartida, certas profissões não podem ser feitas a distância."],["Par conséquent, il faut trouver un équilibre.","Consequentemente, é preciso encontrar um equilíbrio."],["En conclusion, je pense que le modèle hybride est la meilleure solution.","Em conclusão, acho que o modelo híbrido é a melhor solução."]],
write:["Texto argumentativo (180 palavras): o ensino a distância é tão eficaz quanto o presencial? Use pelo menos 6 conectores."]},

{ id:"f23", n:26, title:"Vivre au Canada", short:"Unidade 26", sub:"B2 · imigração, serviços, cultura quebequense",
grammar:`<h4>Falar de mudança e adaptação</h4><div class="ex">Depuis que je suis arrivée, … · Ça fait deux ans que j'habite ici. · Je me suis habituée au froid. · J'ai eu du mal à comprendre l'accent.</div>
<p><b>depuis</b> + duração (ação que continua): J'apprends le français <b>depuis</b> six mois. <b>il y a</b> + duração (passado concluído): Je suis arrivée <b>il y a</b> six mois.</p>
<h4>Québécismes frequentes</h4><table><tr><td>le dépanneur</td><td>loja de conveniência</td></tr><tr><td>la fin de semaine</td><td>o fim de semana (= le week-end)</td></tr><tr><td>le courriel</td><td>o e-mail</td></tr><tr><td>magasiner</td><td>fazer compras</td></tr><tr><td>le souper</td><td>o jantar (dîner = almoço)</td></tr><tr><td>c'est correct</td><td>está tudo bem</td></tr></table>`,
vocab:[["l'immigration","a imigração"],["le nouvel arrivant","o recém-chegado"],["la citoyenneté","a cidadania"],["le permis de travail","a permissão de trabalho"],["la demande","o pedido, a solicitação"],["déposer une demande","fazer um pedido"],["l'intégration","a integração"],["s'adapter","adaptar-se"],["s'habituer à","acostumar-se a"],["avoir du mal à","ter dificuldade em"],["depuis","desde, há (ainda em curso)"],["ça fait … que","faz … que"],["le dépanneur","a loja de conveniência (Quebec)"],["le courriel","o e-mail"],["magasiner","fazer compras (Quebec)"],["le souper","o jantar (Quebec)"],["la fin de semaine","o fim de semana (Quebec)"],["la garderie","a creche"],["les impôts","os impostos"],["la déclaration de revenus","a declaração de imposto de renda"],["la francisation","o curso de francês para imigrantes"],["la communauté","a comunidade"]],
sentences:[["Ça fait six mois que j'apprends le français.","Faz seis meses que estudo francês."],["Au début, j'ai eu du mal à comprendre l'accent québécois.","No início, tive dificuldade em entender o sotaque quebequense."],["Je me suis vite habituée au froid.","Eu me acostumei rápido ao frio."],["Nous avons déposé notre demande de résidence permanente.","Fizemos nosso pedido de residência permanente."],["Les nouveaux arrivants peuvent suivre des cours de francisation gratuits.","Os recém-chegados podem fazer cursos de francês gratuitos."],["La fin de semaine, on aime magasiner au centre-ville.","No fim de semana, gostamos de fazer compras no centro."]],
write:["Escreva uma mensagem a um amigo contando seus primeiros meses (reais ou imaginados) vivendo no Canadá."]},

{ id:"f24", n:27, title:"Hypothèses", short:"Unidade 27", sub:"B2 · si + imparfait / conditionnel · conditionnel passé",
grammar:`<h4>Frases com si</h4><table><tr><th>Hipótese</th><th>Estrutura</th><th>Exemplo</th></tr><tr><td>real / provável</td><td>si + presente → futuro</td><td>Si j'ai le temps, j'étudierai.</td></tr><tr><td>imaginária</td><td>si + imparfait → condicional</td><td>Si j'avais plus de temps, j'étudierais tous les jours.</td></tr><tr><td>irreal no passado</td><td>si + plus-que-parfait → condicional passado</td><td>Si j'avais su, je serais venue.</td></tr></table>
<p>Nunca use futuro ou condicional logo depois de <b>si</b>.</p><p>Condicional passado: avoir/être no condicional + particípio: j'<b>aurais aimé</b>, elle <b>serait partie</b>.</p>`,
vocab:[["si j'avais","se eu tivesse"],["si j'étais","se eu fosse"],["je ferais","eu faria"],["j'irais","eu iria"],["je pourrais","eu poderia"],["il faudrait","seria preciso"],["ce serait","seria"],["j'aurais aimé","eu teria gostado"],["j'aurais dû","eu deveria ter"],["si j'avais su","se eu soubesse (antes)"],["à ta place","no seu lugar"],["au cas où","caso"],["à condition que","desde que"],["sinon","senão"],["la chance","a sorte, a chance"],["le regret","o arrependimento"],["regretter","lamentar, arrepender-se"],["imaginer","imaginar"],["supposer","supor"],["le rêve","o sonho"]],
sentences:[["Si j'avais plus de temps, j'étudierais le français tous les jours.","Se eu tivesse mais tempo, estudaria francês todos os dias."],["Si je réussis le TCF, nous déménagerons au Canada.","Se eu passar no TCF, vamos nos mudar para o Canadá."],["À ta place, je commencerais par la compréhension orale.","No seu lugar, eu começaria pela compreensão oral."],["Si j'avais su, je serais venue plus tôt.","Se eu soubesse, teria vindo mais cedo."],["J'aurais dû réserver le vol plus tôt.","Eu deveria ter reservado o voo antes."],["Ce serait génial de vivre à Québec.","Seria incrível morar em Quebec."]],
write:["Escreva 150 palavras: se você pudesse morar em qualquer cidade do mundo, qual escolheria e o que faria lá?"]},

  exam: {
    title: "TEF Canada e TCF Canada",
    intro: "Treine as quatro competências no formato das provas. CO e CE são de múltipla escolha com nível indicado (A2 a C1); EE e EO têm cronômetro, contagem de palavras e avaliação do Claude com nota e NCLC estimados.",
    estimate(byLvl) {
      const order = ["A1","A2","B1","B2","C1"]; let reached = null;
      for (const l of order) { const v = byLvl[l]; if (!v) continue; if (v[0] / v[1] >= 0.7) reached = l; else break; }
      const nclc = { A1: "1–2", A2: "3–4", B1: "5–6", B2: "7–8", C1: "9–10" };
      return reached ? `Estimativa: você acertou bem as questões até o nível ${reached} (≈ NCLC ${nclc[reached]}). Isto é só uma referência para o treino, não equivale à nota oficial. Para Entrada Expressa costuma-se mirar NCLC 7 (B2) nas quatro competências.` : "Estimativa: ainda abaixo do A2 nestas questões. Continue a sessão diária das unidades e volte ao treino em algumas semanas.";
    },
    info: `<div class="card gram"><div class="eyebrow">Formato das provas</div>
<h4>TCF Canada (France Éducation international)</h4><div class="tablewrap"><table><tr><th>Prova</th><th>Formato</th><th>Duração</th><th>Nota</th></tr><tr><td>Compreensão oral</td><td>39 questões de múltipla escolha</td><td>35 min</td><td>0–699</td></tr><tr><td>Compreensão escrita</td><td>39 questões de múltipla escolha</td><td>60 min</td><td>0–699</td></tr><tr><td>Expressão escrita</td><td>3 tarefas</td><td>60 min</td><td>0–20</td></tr><tr><td>Expressão oral</td><td>3 tarefas, face a face</td><td>12 min</td><td>0–20</td></tr></table></div>
<h4>TEF Canada (CCI Paris Île-de-France)</h4><div class="tablewrap"><table><tr><th>Prova</th><th>Formato</th><th>Duração</th></tr><tr><td>Compreensão escrita</td><td>40 questões</td><td>60 min</td></tr><tr><td>Compreensão oral</td><td>40 questões</td><td>40 min</td></tr><tr><td>Expressão escrita</td><td>Seção A: continuar uma notícia (mín. 80 palavras) · Seção B: defender um ponto de vista (mín. 200 palavras)</td><td>60 min</td></tr><tr><td>Expressão oral</td><td>Seção A: obter informações (5 min) · Seção B: argumentar para convencer (10 min)</td><td>15 min</td></tr></table></div><p>Notas de 0 a 699 por prova, convertidas em NCLC 1 a 12.</p>
<h4>Meta comum: NCLC 7 no TCF Canada</h4><div class="tablewrap"><table><tr><th>NCLC</th><th>CO</th><th>CE</th><th>EE</th><th>EO</th></tr><tr><td>10+</td><td>549–699</td><td>549–699</td><td>16–20</td><td>16–20</td></tr><tr><td>9</td><td>523–548</td><td>524–548</td><td>14–15</td><td>14–15</td></tr><tr><td>8</td><td>503–522</td><td>499–523</td><td>12–13</td><td>12–13</td></tr><tr><td><b>7</b></td><td><b>458–502</b></td><td><b>453–498</b></td><td><b>10–11</b></td><td><b>10–11</b></td></tr><tr><td>6</td><td>398–457</td><td>406–452</td><td>7–9</td><td>7–9</td></tr><tr><td>5</td><td>369–397</td><td>375–405</td><td>6</td><td>6</td></tr></table></div>
<p class="tiny muted">Formatos e tabela conforme as páginas da France Éducation international, digiSchool e IRCC consultadas em novembro de 2026. Confirme no site oficial antes de se inscrever.</p>

{ level:"A2", ctx:"Mensagem na secretária eletrônica.", audio:[{v:1,s:"Sophie",t:"Salut Laura, c'est Sophie. Je ne peux pas venir au cinéma ce soir, ma fille est malade. On peut y aller samedi après-midi ? Rappelle-moi. Bisous !"}], q:"Por que Sophie liga?", options:["Para convidar Laura ao cinema hoje.","Para cancelar e propor sábado à tarde.","Para dizer que está doente.","Para pedir um favor à filha de Laura."], answer:1, explain:"Ela não pode ir hoje porque a filha está doente e propõe « samedi après-midi »." },

{ level:"C1", ctx:"Trecho de uma conferência.", audio:[{v:0,s:"Conférencier",t:"On présente souvent le bilinguisme comme un simple atout sur le marché du travail. C'est réducteur. Les recherches montrent qu'il modifie aussi la manière dont on aborde les problèmes : passer d'une langue à l'autre exerce une forme de flexibilité cognitive qui dépasse largement le domaine linguistique."}], q:"Qual é a ideia principal do conferencista?", options:["O bilinguismo serve sobretudo para conseguir emprego.","Reduzir o bilinguismo a uma vantagem profissional é simplista: ele afeta a forma de pensar.","As pesquisas sobre bilinguismo são inconclusivas.","Mudar de língua prejudica a concentração."], answer:1, explain:"« C'est réducteur » — ele defende que o bilinguismo desenvolve flexibilidade cognitiva além da linguagem." },
{ level:"C1", ctx:"Editorial de rádio.", audio:[{v:0,s:"Éditorialiste",t:"Ce n'est pas tant la hausse des loyers qui inquiète que son rythme. Lorsque les salaires progressent de trois pour cent et les loyers de douze, l'écart ne se résorbe pas de lui-même ; il exige une intervention publique, que les gouvernements successifs ont soigneusement évitée."}], q:"O que mais preocupa o editorialista?", options:["O valor absoluto dos aluguéis.","O ritmo de aumento dos aluguéis, muito mais rápido que o dos salários.","A queda dos salários.","O excesso de intervenção do governo."], answer:1, explain:"« Ce n'est pas tant la hausse … que son rythme » — aluguéis +12% contra salários +3%, e falta de intervenção pública." },
{ level:"B1", ctx:"Aviso num supermercado.", audio:[{v:0,s:"Annonce",t:"Chers clients, notre magasin fermera exceptionnellement à dix-huit heures ce soir en raison de travaux. Nous rouvrirons demain matin à l'heure habituelle, soit huit heures."}], q:"Por que a loja fecha mais cedo hoje?", options:["Por causa de um feriado.","Por causa de obras.","Por falta de funcionários.","Por um inventário."], answer:1, explain:"« en raison de travaux » = por causa de obras. Reabre amanhã às 8h." }

    ce: [
{ level:"A2", text:"Piscine municipale – Horaires d'hiver\nDu lundi au vendredi : 7 h – 21 h\nSamedi : 9 h – 18 h\nDimanche : fermé\nCours de natation pour enfants : mercredi et samedi matin. Inscription obligatoire à l'accueil.", q:"Quando há aulas de natação para crianças?", options:["Todos os dias de manhã.","Quarta e sábado de manhã.","Domingo à tarde.","Segunda a sexta à noite."], answer:1, explain:"« mercredi et samedi matin ». Domingo a piscina fecha." },
{ level:"A2", text:"Bonjour à tous,\nLa réunion de parents aura lieu le jeudi 14 novembre à 18 h 30 dans la salle 12. Nous parlerons du voyage scolaire au Québec. Merci de confirmer votre présence avant lundi.\nMme Dubois, enseignante", q:"O que os pais devem fazer?", options:["Pagar a viagem até segunda.","Confirmar presença até segunda.","Ir à sala 12 na segunda.","Enviar documentos para o Quebec."], answer:1, explain:"« Merci de confirmer votre présence avant lundi »." },
{ level:"A2", text:"À LOUER – Appartement 4 ½, Rosemont\n2 chambres, cuisine rénovée, balcon. Près du métro. 1 450 $ par mois, chauffage inclus. Animaux non acceptés. Libre le 1er juillet.", q:"Qual afirmação está correta?", options:["O aquecimento é pago à parte.","Aceitam animais.","Fica perto do metrô.","Tem três quartos."], answer:2, explain:"« Près du métro ». Aquecimento incluído; animais não aceitos; 2 quartos (o « 4 ½ » quebequense conta cômodos, não quartos)." },
{ level:"B1", text:"Objet : Votre commande n° 48217\nMadame,\nNous vous informons que l'article commandé (machine à café, modèle Duo) est en rupture de stock. Nous pouvons vous proposer soit un remboursement complet sous cinq jours ouvrables, soit le modèle supérieur au même prix. Merci de nous indiquer votre choix.", q:"O que a loja propõe?", options:["Esperar o produto voltar ao estoque.","Reembolso total ou um modelo superior pelo mesmo preço.","Um desconto de 5%.","Trocar por outra cor."], answer:1, explain:"« soit un remboursement complet… soit le modèle supérieur au même prix »." },
{ level:"B1", text:"De plus en plus de Montréalais choisissent le vélo pour aller au travail, même en hiver. La Ville a déneigé cette année plus de 200 km de pistes cyclables. Selon un sondage, 40 % des cyclistes d'hiver disent économiser plus de 1 000 $ par an par rapport à la voiture.", q:"Segundo o texto, por que muitos usam a bicicleta no inverno?", options:["Porque o metrô está em greve.","Por economia: muitos dizem poupar mais de 1 000 $ por ano.","Porque a cidade proibiu carros.","Porque não neva mais em Montreal."], answer:1, explain:"O texto cita a economia em relação ao carro e as ciclovias limpas de neve." },
{ level:"B1", text:"Avis aux locataires\nEn raison de travaux de plomberie, l'eau chaude sera coupée le mardi 3 décembre de 9 h à 15 h. Nous vous recommandons de prévoir vos besoins en conséquence. Nous nous excusons des inconvénients.\nLa gestion", q:"O que vai acontecer na terça?", options:["A água será cortada o dia todo.","A água quente será cortada das 9h às 15h.","Os inquilinos devem sair do prédio.","Haverá reunião sobre a hidráulica."], answer:1, explain:"« l'eau chaude sera coupée … de 9 h à 15 h »." },
{ level:"B1", text:"Marie, 34 ans : « J'ai commencé le bénévolat à la banque alimentaire pour rencontrer des gens après mon arrivée. Au final, c'est là que j'ai trouvé mon emploi actuel : un des responsables m'a recommandée à son entreprise. »", q:"O que o voluntariado trouxe para Marie?", options:["Apenas novas amizades.","Uma recomendação que levou ao emprego atual.","Comida gratuita.","Um diploma reconhecido."], answer:1, explain:"Um responsável « m'a recommandée à son entreprise » e ela conseguiu o emprego." },
{ level:"B2", text:"Longtemps considéré comme un privilège réservé aux cadres, le télétravail s'est démocratisé. Pourtant, les études nuancent l'enthousiasme initial : si la productivité individuelle se maintient, la collaboration informelle — ces échanges spontanés près de la machine à café — s'érode, au détriment de l'innovation.", q:"Segundo o texto, qual é o efeito negativo do teletrabalho?", options:["Queda da produtividade individual.","Redução das trocas informais, prejudicando a inovação.","Aumento dos custos para as empresas.","Mais horas extras."], answer:1, explain:"« la collaboration informelle … s'érode, au détriment de l'innovation ». A produtividade individual se mantém." },
{ level:"B2", text:"La Ville lance une consultation publique sur l'interdiction des voitures dans le Vieux-Québec durant l'été. Les commerçants craignent une baisse de fréquentation, tandis que les résidents soulignent le bruit et la pollution. Les citoyens peuvent donner leur avis en ligne jusqu'au 15 mars.", q:"Qual é a posição dos comerciantes?", options:["São a favor por causa do barulho.","Temem perder clientes.","Querem estender a proibição ao ano todo.","Não foram consultados."], answer:1, explain:"« Les commerçants craignent une baisse de fréquentation »." },
{ level:"B2", text:"Contrairement à une idée reçue, apprendre une langue à l'âge adulte n'est pas voué à l'échec. Si l'enfant acquiert plus facilement l'accent, l'adulte dispose d'atouts considérables : une meilleure capacité d'analyse, des stratégies d'apprentissage conscientes et, surtout, une motivation souvent plus précise.", q:"Qual é a tese do texto?", options:["Adultos não conseguem aprender línguas.","Adultos têm vantagens próprias para aprender línguas, embora as crianças peguem o sotaque mais fácil.","Crianças sempre aprendem melhor em todos os aspectos.","O sotaque é a parte mais importante."], answer:1, explain:"O texto contesta uma « idée reçue » e lista vantagens do adulto: análise, estratégias e motivação." },
{ level:"B2", text:"Madame,\nSuite à notre entretien du 4 octobre, nous avons le plaisir de vous proposer le poste d'analyste financière. Votre entrée en fonction est prévue le 2 décembre, sous réserve de la vérification de vos références. Une période d'essai de trois mois s'appliquera.", q:"A oferta de emprego depende de quê?", options:["De uma segunda entrevista.","Da verificação das referências.","Do fim do período de experiência.","De um exame de francês."], answer:1, explain:"« sous réserve de la vérification de vos références » = sujeito à verificação das referências." },
{ level:"C1", text:"L'essor des plateformes de livraison a redessiné nos villes plus discrètement qu'on ne le pense. Les « cuisines fantômes », ces restaurants sans salle ni enseigne, se multiplient dans les zones industrielles. Commodes pour le consommateur, elles posent néanmoins une question que les urbanistes peinent à trancher : que devient la rue commerçante lorsque le commerce n'a plus besoin de la rue ?", q:"Que questão o texto levanta?", options:["Se as plataformas de entrega são legais.","O futuro das ruas comerciais quando o comércio não precisa mais delas.","Como abrir uma cozinha fantasma.","A qualidade da comida entregue."], answer:1, explain:"A pergunta final: « que devient la rue commerçante lorsque le commerce n'a plus besoin de la rue ? »." },
{ level:"C1", text:"Il serait illusoire de croire que la seule maîtrise de la langue suffise à l'intégration professionnelle des immigrants. Les obstacles tiennent tout autant à la reconnaissance des diplômes, aux réseaux, voire à des biais d'embauche rarement assumés. Réduire le débat à la langue, c'est faire peser sur l'individu une responsabilité largement collective.", q:"O que o autor critica?", options:["O ensino de francês aos imigrantes.","Reduzir a integração profissional apenas à questão da língua.","O reconhecimento automático de diplomas.","Os imigrantes que não falam francês."], answer:1, explain:"Para ele, colocar tudo na língua é transferir ao indivíduo uma responsabilidade « largement collective »." },
{ level:"B1", text:"Bibliothèque du quartier – Nouveau service\nVous pouvez maintenant emprunter des livres numériques gratuitement avec votre carte de membre. Téléchargez l'application, entrez votre numéro de carte et votre NIP. Maximum : 5 livres pour 21 jours.", q:"O que é preciso para usar o novo serviço?", options:["Pagar uma taxa mensal.","Ter cartão de membro e o aplicativo.","Ir à biblioteca a cada 21 dias.","Comprar os livros digitais."], answer:1, explain:"Gratuito, com « votre carte de membre », o aplicativo e o NIP (senha)." }

<script>

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- content index ---------- */
const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48);
const ITEMS = [], BYID = {};
C.units.forEach((u, ui) => {
  u.ui = ui; u.items = [];
  if (u.review) return;
  const seen = new Set();
  (u.vocab || []).forEach(v => {
    let id = u.id + ":w:" + slug(v[0]); if (seen.has(id)) id += "2"; seen.add(id);
    const it = { id, u: u.id, ui, k: "w", t: v[0], m: v[1], ex: v[2] || "", exm: v[3] || "" };
    ITEMS.push(it); BYID[id] = it; u.items.push(it);
  });
  (u.sentences || []).forEach(s => {
    let id = u.id + ":s:" + slug(s[0]); if (seen.has(id)) id += "2"; seen.add(id);
    const it = { id, u: u.id, ui, k: "s", t: s[0], m: s[1] };
    ITEMS.push(it); BYID[id] = it; u.items.push(it);
  });
});
const UNIT = Object.fromEntries(C.units.map(u => [u.id, u]));
const LEARN_UNITS = C.units.filter(u => !u.review);

/* ---------- dates ---------- */

/* ---------- merge (para vários aparelhos) ---------- */
function mergeProfiles(a, b) { // retorna mescla; a e b são versões do mesmo perfil
  if (!a) return b; if (!b) return a;
  const newer = (b.updated || 0) > (a.updated || 0) ? b : a, older = newer === a ? b : a;
  const m = JSON.parse(JSON.stringify(newer));
  for (const [id, st] of Object.entries(older.it || {})) { const x = m.it[id]; if (!x || (st.t || 0) > (x.t || 0)) m.it[id] = st; }
  for (const [d, v] of Object.entries(older.days || {})) {
    const x = m.days[d]; if (!x) { m.days[d] = v; continue; }
    for (const k of Object.keys(v)) if (typeof v[k] === "number") x[k] = Math.max(x[k] || 0, v[k]);
  }
  const ids = new Set((m.exam?.hist || []).map(h => h.id));
  for (const h of (older.exam?.hist || [])) if (!ids.has(h.id)) m.exam.hist.push(h);
  const wid = new Set((m.writes || []).map(h => h.id));
  for (const h of (older.writes || [])) if (!wid.has(h.id)) (m.writes = m.writes || []).push(h);
  if (older.cur && (!m.cur || (older.cur.ts || 0) > (m.cur.ts || 0))) m.cur = older.cur;
  return m;
}

const CONTR = C.contractions || {};

const SEC_REV = 12, SEC_NEW = 35;
function plan() {

  const budget = min * 60;
  let r = Math.min(due.length, Math.floor(budget * 0.7 / SEC_REV));
  let n = Math.min(avail.length, Math.floor((budget - r * SEC_REV) / SEC_NEW));
  r = Math.min(due.length, r + Math.floor((budget - r * SEC_REV - n * SEC_NEW) / SEC_REV));

}

    for (let k = 0; k < 4 && ri < reviews.length; k++, ri++) q.push({ id: reviews[ri].id, ex: exFor(reviews[ri], "rev"), mode: "rev" });
    for (const it of shuffle(grp)) q.push({ id: it.id, ex: exFor(it, "learn"), mode: "learn" });

}

    let ex = exType === "mix" ? exFor(it, "rev") : exType;
    if (ex === "tiles" ) ex = it.k === "s" ? (P.set.audio ? "tiles_listen" : "tiles_pt") : "type_hint";

}

    }
    case "self-ok": if (!R.ans) { micStop(); feedback(true, "ok", it); } break;
    case "self-bad": if (!R.ans) { micStop(); feedback(false, "bad", it); } break;
    case "flip": R.flip = !R.flip; if (R.flip && R.dir === "pt") speak(it.t); showFlash(); break;
    case "fdir": R.dir = el.dataset.d; R.flip = false; showFlash(); break;
    case "fl-ok": case "fl-bad": { const ok = a === "fl-ok"; grade(it, ok, R.cur.mode); skill("flash", ok); R.res.push({ id: it.id, ok }); if (!ok) R.wrong.add(it.id); touch(); R.pos++; R.flip = false; showFlash(); break; }
    /* exam */
    case "exam-sec": view = "examsec"; viewArg = el.dataset.s; EX = null; render(); examTimer(); break;
    case "exam-task": { EX.task = +el.dataset.i; const t = (viewArg === "ee" ? C.exam.ee : C.exam.eo)[EX.task]; EX.secs = t.secs; EX.tick = false; EX.text = ""; EX.res = null; render(); break; }
    case "ex-timer": EX.tick = !EX.tick; examTimer(); render(); break;
    case "co-play": speakLines(EX.list[EX.pos].audio); break;
    case "ex-pick": { const q = EX.list[EX.pos]; const i = +el.dataset.i; EX.ans[EX.pos] = { pick: i, ok: i === q.answer }; render(); break; }
    case "ex-next": EX.pos++; render(); break;
    case "ex-restart": EX = null; render(); break;
    case "eo-mic": {
      if (micState !== "idle") { micStop(); break; }
      const base = EX.text ? EX.text.trim() + " " : "";
      micStart((text, final, reason) => { const ta = $("#extext"); EX.text = base + text.trim(); if (ta) ta.value = EX.text; if (final && reason && !["stopped", "viewer_stopped"].includes(reason) && !text) toast("Microfone indisponível. Digite um resumo do que falou."); });
      break;
    }
    case "ex-correct": {
      if (!EX.text.trim()) return toast(viewArg === "ee" ? "Escreva seu texto primeiro." : "Grave ou digite sua resposta primeiro.");
      const t = (viewArg === "ee" ? C.exam.ee : C.exam.eo)[EX.task];
      EX.busy = true; render();
      correctWriting(EX.text, `${t.exam} — ${t.task} (${viewArg === "ee" ? "expressão escrita" : "expressão oral; o texto é a transcrição automática da fala, ignore pontuação e pequenas falhas de transcrição"}). ${t.prompt} ${t.words ? "Extensão pedida: " + t.words + "." : ""} Avalie segundo os critérios oficiais (adequação à tarefa, coerência, vocabulário, gramática).`, { level: "intermediário, preparando-se para o " + t.exam, examFields: ', "nclc_estimado": "NCLC estimado (ex.: 6)", "nota_exame": "nota estimada na escala do exame (TCF 0–20 ou TEF 0–699)"' })
        .then(r => { EX.res = r; if (r.nclc_estimado || r.nota_exame) r.resumo = `${r.nota_exame ? "Nota estimada: " + r.nota_exame + ". " : ""}${r.nclc_estimado ? "NCLC estimado: " + r.nclc_estimado + ". " : ""}${r.resumo || ""}`; P.exam.hist.push({ id: Date.now().toString(36), sec: viewArg, title: t.exam + " " + t.task, pct: Math.round((+r.nota || 0) * 10), ts: Date.now() }); touch(); })
        .catch(e => { EX.res = { error: aiErr(e) }; })
        .finally(() => { EX.busy = false; if (view === "examsec") render(); });
      break;
    }
  }
});
document.addEventListener("input", ev => {
  const el = ev.target; const k = el.dataset.actInput;
  if (k === "wtext") { writeState.text = el.value; const l = el.parentElement.querySelector("label .num"); if (l) l.textContent = `(${(el.value.trim().match(/\S+/g) || []).length} palavras)`; }
  if (k === "extext" && EX) { EX.text = el.value; const l = el.parentElement.querySelector("label .num"); if (l) l.textContent = `(${(el.value.trim().match(/\S+/g) || []).length} palavras)`; }
});
document.addEventListener("change", ev => {
  const el = ev.target; const k = el.dataset.actChange; if (!k) return;
  if (k === "voice") { P.set.voice = el.value; touch(); speak(C.voiceSample, { force: true }); }
  if (k === "audio") { P.set.audio = el.checked; touch(); }
  if (k === "speakset") { P.set.speak = el.checked; touch(); }
  if (k === "wprompt") { writeState.prompt = writePrompts()[+el.value]; writeState.res = null; render(); }
});
document.addEventListener("keydown", ev => {
  if (!R || $("#run").hidden) return;
  if (ev.key === "Enter") {
    ev.preventDefault();
    if (R.ans || (R.cur && R.cur.ex === "intro")) { $("[data-act=next]")?.click(); }
    else if (R.kind !== "flash") doCheck();
  } else if (R.kind === "flash" && ev.key === " ") { ev.preventDefault(); if (!R.flip) $("[data-act=flip]")?.click(); }
  else if (!R.ans && R.cur && ["mc", "listen"].includes(R.cur.ex) && /^[1-4]$/.test(ev.key) && document.activeElement?.tagName !== "INPUT") { document.querySelectorAll(".opt")[+ev.key - 1]?.click(); }
});

/* ---------- boot ---------- */
if (S.last && S.profiles[S.last]) setProfile(S.last); else if (S.order.length) setProfile(S.order[0]); else updateChip();
render();
setSync("init");
initCloud();
window.addEventListener("focus", () => { if (dirty.size) flush(); });
})();

</script>
